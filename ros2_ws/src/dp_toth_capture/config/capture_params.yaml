image_capture:
  ros__parameters:

    # ----------------------------------
    # Kamera
    # ----------------------------------

    image_topic: "/image_raw"

    # ----------------------------------
    # Ukladanie obrazkov
    # ----------------------------------

    output_dir: "~/DP/datasets/captured"

    session_name: "default"

    # ----------------------------------
    # Automaticke zachytavanie
    # ----------------------------------

    capture_interval: 0.5

    auto_capture: false

    # ----------------------------------
    # Graficke rozhranie
    # ----------------------------------

    show_preview: false

    # ----------------------------------
    # Format obrazkov
    # ----------------------------------

    image_format: "jpg"

    jpeg_quality: 95